# ==============================================================================
# Configuración de Mosquitto MQTT Broker para Monitoreo Solar Local (macOS)
# ==============================================================================

# Escuchar en todas las interfaces de red locales (LAN Wi-Fi / Ethernet)
# para que los celulares de la familia puedan conectarse directamente a la Mac
listener 1883 0.0.0.0
protocol mqtt

# Opcional: Listener WebSockets por si se desea abrir la app en navegador web
listener 9001 0.0.0.0
protocol websockets

# Red doméstica local: permitir conexión sin contraseña para los miembros de casa
allow_anonymous true

# Persistencia de mensajes retenidos (última lectura e historial de 24h)
persistence true
persistence_location /opt/homebrew/var/lib/mosquitto/

# Logs del broker
log_dest file /opt/homebrew/var/log/mosquitto/mosquitto.log
log_dest stdout
log_type error
log_type warning
log_type notice
log_type information
connection_messages true
log_timestamp true
